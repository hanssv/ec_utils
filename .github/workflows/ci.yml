name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28', '29']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.3'

      - name: Compile
        run: rebar3 compile

      - name: Run EUnit & Benchmarks
        run: rebar3 eunit

      - name: Install ELP
        run: |
          curl -fSL -o elp.tar.gz https://github.com/WhatsApp/erlang-language-platform/releases/latest/download/elp-linux-x86_64-unknown-linux-musl.tar.gz
          tar -xzf elp.tar.gz
          chmod +x elp
          echo "$PWD" >> $GITHUB_PATH

      - name: Run eqWAlizer
        run: elp eqwalize-all --as default

      - name: Run Dialyzer
        run: rebar3 dialyzer
