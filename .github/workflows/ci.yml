name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28', '29']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.3'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      - name: Compile
        run: rebar3 compile

      - name: Run EUnit & Benchmarks
        run: rebar3 eunit

      - name: Install ELP
        # Pinned ELP release 2026-10-14; keep in sync with mise.toml
        run: |
          gh release download 2026-10-14 --repo WhatsApp/erlang-language-platform \
            --pattern "elp-linux-x86_64-unknown-linux-gnu-otp-${{ matrix.otp }}*.tar.gz" \
            --output elp.tar.gz
          tar -xzf elp.tar.gz
          chmod +x elp
          echo "$PWD" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run eqWAlizer
        run: elp eqwalize-all --as default

      - name: Run Dialyzer
        run: rebar3 dialyzer
