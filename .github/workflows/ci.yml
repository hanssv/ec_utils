name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.3'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      - name: Cache erlfmt
        id: cache-erlfmt
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/erlfmt
          key: erlfmt-${{ runner.os }}-otp-${{ matrix.otp }}-v1

      - name: Install erlfmt
        if: steps.cache-erlfmt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          git clone --depth 1 https://github.com/Quviq/erlfmt.git /tmp/erlfmt
          cd /tmp/erlfmt
          rebar3 as release escriptize
          cp _build/release/bin/erlfmt ~/.local/bin/erlfmt
          rm -rf /tmp/erlfmt

      - name: Check code formatting
        run: PATH="$HOME/.local/bin:$PATH" make fmt-check

      - name: Compile
        run: rebar3 compile

      - name: Run EUnit & Benchmarks
        run: rebar3 eunit

      - name: Run Performance Benchmarks
        run: |
          echo "## Cryptographic Performance Benchmarks (OTP ${{ matrix.otp }})" >> $GITHUB_STEP_SUMMARY
          rebar3 as bench compile
          ./bin/bench --markdown -d 100 all >> $GITHUB_STEP_SUMMARY

      - name: Publish Benchmark Results to PR
        if: github.event_name == 'pull_request' && matrix.otp == '29'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE="/tmp/bench.md"
          MARKER="<!-- ec_utils-benchmark -->"
          echo "$MARKER" > "$BODY_FILE"
          echo "## Cryptographic Performance Benchmarks (OTP ${{ matrix.otp }})" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          ./bin/bench --markdown -d 100 all >> "$BODY_FILE"

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -F body=@"$BODY_FILE"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$BODY_FILE"
          fi

      - name: Install ELP
        # Pinned ELP release 2026-10-14; keep in sync with mise.toml
        run: |
          gh release download 2026-10-14 --repo WhatsApp/erlang-language-platform \
            --pattern "elp-linux-x86_64-unknown-linux-gnu-otp-${{ matrix.otp }}*.tar.gz" \
            --output elp.tar.gz
          tar -xzf elp.tar.gz
          chmod +x elp
          echo "$PWD" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run eqWAlizer
        run: elp eqwalize-all --as default

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3/rebar3_*_plt
            _build/default/rebar3_*_plt
          key: dialyzer-plt-${{ runner.os }}-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'src/ec_utils.app.src') }}
          restore-keys: |
            dialyzer-plt-${{ runner.os }}-otp-${{ matrix.otp }}-

      - name: Run Dialyzer
        run: rebar3 dialyzer
