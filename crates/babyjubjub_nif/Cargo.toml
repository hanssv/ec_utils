[package]
name = "ecu_babyjubjub_nif"
version = "0.1.0"
edition = "2024"

[lib]
name = "ecu_babyjubjub_nif"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = "0.39.0"
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"

[target.'cfg(target_arch = "aarch64")'.dependencies]
babyjubjub-rs = { version = "0.0.11", default-features = false, features = ["aarch64"] }

[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
babyjubjub-rs = { version = "0.0.11" }

